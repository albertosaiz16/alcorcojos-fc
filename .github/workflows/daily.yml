name: pipeline

on:
  push:
    paths: ['data/raw/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # Metricas deterministas: docs/data.json + data/brief.json
      - name: Calcular metricas
        run: python -m pipeline.run

      # Render con el analisis que hubiera de la ejecucion anterior.
      # El analisis lo escribe el workflow analisis.yml, aparte.
      - name: Generar sitio
        run: python -m pipeline.render

      - name: Commit
        run: |
          git config user.name  "alcorcojos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data/history.parquet data/brief.json
          git diff --staged --quiet || git commit -m "pipeline $(date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
